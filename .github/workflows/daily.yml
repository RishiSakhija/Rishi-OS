name: daily

# Morning pipeline. Per the blueprint the sequence is:
#   daily_reset -> growth_coach -> research -> idea_strategist
#               -> packaging_studio -> summarize_librarian -> ceo_supervisor
# Every step is continue-on-error and every agent exits 0 by design
# (AGENTS.md Rule 5) -- this workflow must never enter a retry loop.

on:
  schedule:
    # 05:30 UTC every day
    - cron: "30 5 * * *"
  workflow_dispatch:

concurrency:
  group: rishi-os-daily
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      OLLAMA_BASE_URL: ${{ secrets.OLLAMA_BASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Reset daily counters
        continue-on-error: true
        run: python scripts/daily_reset.py

      - name: Growth Coach Agent
        continue-on-error: true
        run: python -m agents.growth_coach_agent

      - name: Research Agent
        continue-on-error: true
        run: python -m agents.research_agent

      - name: Idea Strategist
        continue-on-error: true
        run: python -m agents.idea_strategist

      - name: Packaging Studio
        continue-on-error: true
        run: python -m agents.packaging_studio

      - name: Summarize Librarian
        continue-on-error: true
        run: python -m agents.summarize_librarian

      - name: CEO Supervisor
        continue-on-error: true
        run: python -m agents.ceo_supervisor

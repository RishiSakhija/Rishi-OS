name: daily

# Daily agent cycle. Resets the run counters, then runs the once-a-day agents.
# Every step is continue-on-error and every agent exits 0 by design
# (AGENTS.md Rule 5) -- this workflow must never enter a retry loop.

on:
  schedule:
    # 05:30 UTC every day
    - cron: "30 5 * * *"
  workflow_dispatch:

concurrency:
  group: rishi-os-daily
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      OLLAMA_BASE_URL: ${{ secrets.OLLAMA_BASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Reset daily counters
        continue-on-error: true
        run: python scripts/daily_reset.py

      - name: 1. Research Agent
        continue-on-error: true
        run: python -m agents.research_agent

      - name: 2. Growth Coach Agent
        continue-on-error: true
        run: python -m agents.growth_coach_agent

      - name: 4. Idea Strategist
        continue-on-error: true
        run: python -m agents.idea_strategist

      - name: 5. Packaging Studio
        continue-on-error: true
        run: python -m agents.packaging_studio

      - name: 6. Analytics Auditor
        continue-on-error: true
        run: python -m agents.analytics_auditor
